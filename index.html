
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>容器照合システム</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>容器照合システム</h1>

<div id="status">読み取り対象を選択してください</div>

<button onclick="selectScan(1)">バーコード①読取</button>
<button onclick="selectScan(2)">バーコード②読取</button>

<p id="barcode1">① 未読取</p>
<p id="barcode2">② 未読取</p>

<h1 id="result">照合待ち</h1>

<input
    type="text"
    id="scannerInput"
    autocomplete="off"
    placeholder="バーコード読み取り待ち"
>

<button onclick="resetScan()">リセット</button>

<script src="app.js"></script>

</body>
</html>
