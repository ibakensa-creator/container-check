
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>容器照合システム</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>容器照合システム</h1>

    <p id="status">読み取り対象を選択してください</p>

    <div class="scan-area">

        <section class="scan-card">
            <h2>① 検体ラベル</h2>
            <button type="button" onclick="selectScan(1)">
                ① 読み取り
            </button>
            <div id="barcode1" class="barcode">
                未読取
            </div>
        </section>

        <section class="scan-card">
            <h2>② 容器ラベル</h2>
            <button type="button" onclick="selectScan(2)">
                ② 読み取り
            </button>
            <div id="barcode2" class="barcode">
                未読取
            </div>
        </section>

    </div>

    <div id="result-area">
        <div id="result">照合待ち</div>
    </div>

    <div class="input-area">
        <p>バーコード入力欄（11桁）</p>

        <form id="scanForm">
            <input
                type="text"
                id="scannerInput"
                maxlength="30"
                autocomplete="off"
                placeholder="スキャナーで読み取ってください"
            >
            <button type="submit" hidden></button>
        </form>
    </div>

    <button type="button" class="reset-button"
        onclick="resetScan()">
        リセット
    </button>

</div>

<script src="app.js"></script>

</body>
</html>
